<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — App Press Store</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('apppress-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    body { padding: 0; min-height: 100vh; display: grid; place-items: center; }
    .lost { max-width: 520px; margin: 24px; padding: 40px 32px; border-radius: 30px; text-align: center; }
    .lost .code { display: inline-grid; place-items: center; width: 96px; height: 96px; border-radius: 28px; font-size: 30px; font-weight: 800; color: var(--amber-ink); margin-bottom: 22px; }
    .lost h1 { font-size: 30px; font-weight: 800; margin-bottom: 10px; }
    .lost p { margin: 0 0 28px; }
  </style>
</head>
<body>
  <main class="lost raised">
    <span class="code inset">404</span>
    <h1>This page wandered off</h1>
    <p>The link may be old or mistyped. Everything lives on the App Press Store home page.</p>
    <a class="btn btn-amber" href="/">Back to App Press Store</a>
  </main>
</body>
</html>
